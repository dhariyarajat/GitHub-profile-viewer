    <input type="text" id="inp" />
    <button id="btn">Load User</button>
    <p id="validationError"></p>
    <div id="dash" class="dash">
      <h2 id="name"></h2>
      <h1 id="followers"></h1>
      <p id="repos"></p>
    </div>
    <h1 id="error" class="hidden">User Not found..!</h1>
    <script>
      const name = document.getElementById("name");
      const dash = document.getElementById("dash");
      const error = document.getElementById("error");
      const validationerror = document.getElementById("validationerror");
      const followers = document.getElementById("followers");
      const repos = document.getElementById("repos");
      async function fetchName(username) {
        try {
          const userUrl = `https://api.github.com/users/${username}`;
          const userResponse = await fetch(userUrl);
          if (!userResponse.ok) {
            throw new Error("User not found");
          }
          const userData = await userResponse.json();
          name.textContent = userData.name || userData.login;

          const follower =
            userData.followers > 1000
              ? (userData.followers / 1000).toFixed(1) + "K"
              : userData.followers;
          followers.textContent = follower || "0";
          repos.textContent = userData.public_repos;
        } catch {
          dash.classList.add("hidden");
          error.classList.remove("hidden");
        }
      }

      const btn = document.getElementById("btn");
      btn.addEventListener("click", () => {
        dash.classList.remove("hidden");
        error.classList.add("hidden");
        name.textContent = "Loading...";

        const inp = document.getElementById("inp");
        const user = inp.value.trim().toLowerCase();
        if(user===""){
          validationerror.textContent="pls Enter username "
          inp.focus()
          return
        }

        fetchName(user);
      });
    </script>
